site_name: 孕期手册

nav:
  - 孕期:
    - 检查项目: pregnancy/检查项目.md
    - 孕中期: pregnancy/孕中期.md
    - 孕晚期: pregnancy/孕晚期.md
    - 产检: pregnancy/产检.md



plugins:
  - search

markdown_extensions:
  - attr_list


theme:
  name: material
  custom_dir: overrides
  logo: 'images/favicon.png'
  favicon: images/favicon.png
  features:
    # - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.prune
    - toc.integrate
    - navigation.top
  language: zh
  palette: 
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-night
        name: Switch to light mode

